<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Generador de la marca dinámica del Museo Evita Palacio Ferreyra.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Generador Museo Evita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@300;400;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: sala blanca — la marca colgada a la izquierda con su cartela de museo; a la derecha el tablero de control; abajo la tira de variaciones */
:root{
  --paper:#FFFFFF;
  --ink:#14110F;
  --muted:#6B645C;
  --rule:#E3DED6;
  --stone:#F4F2EE;
  --season:#A08CC4;
  --f-display:"Zilla Slab", Georgia, serif;
  --f-body:"Public Sans", system-ui, sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body,button,label,p,small,span,b{hyphens:none;word-break:normal;overflow-wrap:normal}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,4vw,48px);padding-block:0 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--ink)}
.top .brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.01em}
.top .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.season-bar{height:4px;display:flex}
.season-bar i{flex:1;transition:background .5s}

.main{display:flex;flex-direction:column;gap:clamp(28px,4vw,48px);padding-top:clamp(16px,3vw,32px)}

.stage{display:flex;flex-direction:column;gap:28px;min-width:0}
.wall{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:clamp(32px,7vw,96px) clamp(20px,6vw,96px);display:flex;align-items:center;justify-content:center;min-height:clamp(240px,40vw,560px);position:relative}
.wall svg{width:100%;max-width:1080px;height:auto;display:block}
.wall .corner{position:absolute;top:12px;left:14px;font-family:var(--f-data);font-size:11px;color:var(--muted)}

.cartela{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);}
.cartela div{padding:12px 14px 4px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.cartela div+div{padding-left:14px;border-left:1px solid var(--rule)}
.cartela small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cartela b{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,2.6vw,32px);line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:normal;word-break:keep-all;hyphens:none}
@media (max-width:520px){.cartela{grid-template-columns:repeat(2,1fr)}.cartela div:nth-child(3){border-left:0;padding-left:0}}
.datelong{font-family:var(--f-display);font-size:18px;color:var(--muted);margin:0;text-transform:capitalize}

.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 clamp(20px,3vw,40px);border-top:1px solid var(--ink);min-width:0}
.sec{padding-block:16px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ink);border-radius:999px;padding:3px;gap:3px}
.seg button{border:0;border-radius:999px;padding:7px 10px;background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.sbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sbtn span{font-weight:500}
.chips{display:flex;gap:4px}
.chips i{width:100%;height:14px;border-radius:2px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
input[type=number],input[type=date]{font-family:var(--f-data);font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--ink)}
.bignum{display:flex;align-items:baseline;gap:10px}
.bignum input{font-family:var(--f-display);font-size:30px;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:0 0 2px;width:7ch;background:transparent}
.bignum span{color:var(--muted)}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;padding:9px 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.btn:hover{background:var(--stone)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#2D2824}
.btn:disabled{opacity:.4;cursor:default}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:transform .2s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{transform:translateX(18px)}
.note{font-size:12px;color:var(--muted);margin:0}
.dlbar{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:16px 18px;background:var(--stone);border-radius:6px}
.dl-label{font-family:var(--f-display);font-size:20px;flex:1 1 auto}
.dl-btns{display:flex;gap:10px}
.btn.big{padding:12px 24px;font-size:15px}
.dlbar .status{flex-basis:100%;margin:0}
.dlbar .status:empty{display:none}
.dlbar.bw{background:var(--paper);border:1px solid var(--rule)}
.dl-label small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);margin-top:2px}
.bw-prev{width:200px;max-width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.bw-prev svg{width:100%;height:auto;display:block}
.status{font-size:12px;color:var(--muted);min-height:1.3em;margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.strip{margin-top:clamp(32px,5vw,56px);border-top:1px solid var(--ink);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.strip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.strip-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
@media (max-width:640px){
  .wrap{padding-block:0 40px}
  .main{padding-top:16px;gap:24px}
  .wall{padding:44px 20px 28px;min-height:0}
  .wall svg{max-width:300px}
  .stage{gap:18px}
  .datelong{font-size:16px}
  .cartela b{font-size:24px}
  .controls{grid-template-columns:1fr}
  .sec{padding-block:14px 18px;border-bottom:1px solid var(--rule)}
  .row .btn{flex:1 1 auto;min-height:44px}
  .seg button{min-height:40px}
  .bignum input{font-size:34px;width:100%}
  input[type=range]{height:32px}
  .thumbs{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .strip-head .btn{width:100%;min-height:44px}
  .strip-head h2{font-size:20px}
  .dlbar{padding:14px 16px}
  .dl-label{font-size:16px}
  .dl-btns{flex:1 1 100%}
  .dl-btns .btn{flex:1;min-height:48px}
}
.thumb{border:1px solid var(--rule);border-radius:2px;padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px;background:var(--paper);cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.thumb:hover{border-color:var(--ink)}
.thumb svg{width:100%;height:auto}
.thumb small{font-family:var(--f-data);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.empty{color:var(--muted);font-size:13px}
.mod{animation:in .35s ease both}
@keyframes in{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.mod{animation:none}.season-bar i{transition:none}}
</style>
</head>
<body>


<div class="wrap">

  <div class="main">
    <section class="stage" aria-label="Marca generada">
      <div class="wall"><span class="corner" id="corner"></span><div id="mark" style="width:100%;display:flex;justify-content:center"></div></div>
      <p class="datelong" id="dateLong"></p>
      <div class="cartela">
        <div><small>Visitantes</small><b id="kVis">0</b></div>
        <div><small>Capacidad</small><b id="kPct">0%</b></div>
        <div><small>Módulos</small><b id="kMod">4</b></div>
        <div><small>Estación</small><b id="kSea">—</b></div>
      </div>
    </section>

    <aside class="controls" aria-label="Controles">
      <div class="sec">
        <h2>Temporada</h2>
        <div class="seg" role="group" aria-label="Elegir por">
          <button id="modeDate" aria-pressed="true">Por fecha</button>
          <button id="modeSeason" aria-pressed="false">Por estación</button>
        </div>
        <div id="byDate" class="row" style="align-items:flex-end">
          <label class="field" for="date" style="flex:1;min-width:150px">Fecha
            <input type="date" id="date">
          </label>
          <button class="btn" id="today">Hoy</button>
        </div>
        <div id="bySeason" class="seasons" hidden></div>
      </div>

      <div class="sec">
        <h2>Público del día</h2>
        <div class="bignum"><input type="number" id="visitors" min="0" step="1" value="150" aria-label="Visitantes"><span>personas</span></div>
        <input type="range" id="range" min="0" max="240" step="1" value="150" aria-label="Visitantes">
        <div class="ticks"><span>0% · 4</span><span>50% · 8</span><span>100% · 12</span></div>
        <div class="row">
          <button class="btn" id="minus5">−10</button>
          <button class="btn" id="plus5">+10</button>
          <button class="btn solid" id="sim">Simular el día</button>
        </div>
        <label class="field" for="avg">Capacidad del museo (100%)
          <input type="number" id="avg" min="10" step="10" value="200">
        </label>
      </div>

      <div class="sec">
        <h2>Vista</h2>
        <label class="switch" for="showGrid"><span>Mostrar grilla</span><input type="checkbox" id="showGrid"></label>
        <div class="row"><button class="btn" id="regen">Otra variación</button></div>
      </div>

    </aside>
    <div class="dlbar">
      <span class="dl-label">Descargar esta marca</span>
      <div class="dl-btns">
        <button class="btn solid big" id="dlSvg">↓ SVG</button>
        <button class="btn solid big" id="dlPng">↓ PNG</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
    <div class="dlbar bw">
      <div class="bw-prev" id="bwPrev" aria-label="Vista previa a una tinta"></div>
      <span class="dl-label">Versión a una tinta<small>Escala de grises de los colores de esta marca</small></span>
      <div class="dl-btns">
        <button class="btn big" id="dlSvgBw">↓ SVG</button>
        <button class="btn big" id="dlPngBw">↓ PNG</button>
      </div>
    </div>
  </div>

  <section class="strip" aria-label="Últimas variaciones">
    <div class="strip-head">
      <h2>Últimas variaciones</h2>
      <button class="btn" id="dlZip" disabled>Descargar variaciones (.zip)</button>
    </div>
    <div class="thumbs" id="thumbs"><p class="empty">Las variaciones aparecen acá a medida que cambiás los datos.</p></div>
  </section>
</div>

const SEASONS = [
  {id:'primavera', name:'Primavera', colors:['#8A6DB0','#C9637E','#D9A93A','#6E9150']},
  {id:'verano',    name:'Verano',    colors:['#3E8FB8','#C0432B','#E07F35','#3F6B3A']},
  {id:'otono',     name:'Otoño',     colors:['#D9A07E','#B88A64','#7E3717','#3F1B16']},
  {id:'invierno',  name:'Invierno',  colors:['#764351','#A68583','#132A32','#72818C']},
];
const ROWS=4, COLS=3, CELL=100;

// combinaciones con al menos un módulo por renglón; por cantidad se guardan las que menos lados comparten
const LAYOUTS={};
(function(){
  const all={};
  for(let mask=1;mask<4096;mask++){
    const cells=[];
    for(let i=0;i<12;i++) if(mask>>i&1) cells.push([Math.floor(i/3),i%3]);
    if(new Set(cells.map(c=>c[0])).size<4) continue;
    let touch=0;
    for(const [r,c] of cells){ if(c<2 && mask>>(r*3+c+1)&1) touch++; if(r<3 && mask>>((r+1)*3+c)&1) touch++; }
    (all[cells.length]=all[cells.length]||[]).push({cells,touch});
  }
  for(const n in all){
    const min=Math.min(...all[n].map(x=>x.touch));
    LAYOUTS[n]=all[n].filter(x=>x.touch<=min+(n>6?1:0)).map(x=>x.cells);
  }
})();

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seasonOf(d){const k=(d.getMonth()+1)*100+d.getDate(); if(k>=921&&k<=1220)return 0; if(k>=1221||k<=320)return 1; if(k>=321&&k<=620)return 2; return 3}
function piecesFor(v,avg){return Math.min(12,4+Math.floor(v/avg*8+1e-9))}

function assign(cells,r,K=4,all=true){
  const n=cells.length; let best=null,bs=1e9;
  for(let t=0;t<400;t++){
    let list;
    if(all){ const base=shuffle(Array.from({length:K},(_,i)=>i),r); while(base.length<n) base.push(base[base.length%K]); list=shuffle(base.slice(0,n),r); }
    else list=Array.from({length:n},()=>Math.floor(r()*K));
    let s=0;
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){ if(list[i]!==list[j])continue;
      const dr=Math.abs(cells[i][0]-cells[j][0]),dc=Math.abs(cells[i][1]-cells[j][1]);
      if(dr+dc===1)s+=10; else if(dr===1&&dc===1)s+=1; }
    if(s<bs){best=list;bs=s} if(s===0)break;
  }
  return best;
}
function compose(key,visitors,avg,salt,K){
  visitors=Math.floor(visitors/10)*10;
  const n=piecesFor(visitors,avg), r=rng(hash(key+'|'+Math.floor(visitors/10)+'|'+n+'|'+salt));
  const pool=LAYOUTS[n], cells=pool[Math.floor(r()*pool.length)];
  return {n,cells,figs:assign(cells,r,4),cols:assign(cells,r,K,false)};
}

const LOGO_SCALE=1.08, GAP=48, LOGO_Y=100;
const W=COLS*CELL+GAP+Math.ceil(811*LOGO_SCALE), H=ROWS*CELL;
function svgFor(c,colors,grid,size,vertical){
  const pad=4;
  const VLS=0.52, VW=Math.ceil(811*VLS), VG=44;
  const w=vertical?VW:W, h=vertical?H+VG+Math.ceil(209*VLS):H;
  const gx=vertical?Math.round((VW-COLS*CELL)/2):0;
  const vw=w+pad*2, vh=h+pad*2;
  const dim=size?` width="${size}" height="${Math.round(size*vh/vw)}"`:'';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${vw} ${vh}"${dim}>`;
  s+=`<g transform="translate(${gx} 0)">`;
  c.cells.forEach(([row,col],i)=>{ s+=`<g class="mod" transform="translate(${col*CELL} ${row*CELL}) scale(${CELL/130})"><path fill-rule="evenodd" d="${A.icons[c.figs[i]]}" fill="${colors[c.cols[i]]}"/></g>` });
  if(grid){ s+=`<g fill="none" stroke="#14110F" stroke-width="1.6">`;
    for(let x=0;x<=COLS;x++) s+=`<line x1="${x*CELL}" y1="0" x2="${x*CELL}" y2="${H}"/>`;
    for(let y=0;y<=ROWS;y++) s+=`<line x1="0" y1="${y*CELL}" x2="${COLS*CELL}" y2="${y*CELL}"/>`;
    s+=`</g>`; }
  s+=`</g>`;
  const lt=vertical?`translate(0 ${H+VG}) scale(${VLS})`:`translate(${COLS*CELL+GAP} ${LOGO_Y}) scale(${LOGO_SCALE})`;
  s+=`<g transform="${lt}" fill="#14110F">`+A.logo.map(d=>`<path d="${d}"/>`).join('')+`</g></svg>`;
  return s;
}
const MQ=window.matchMedia('(max-width:640px)');
const isV=()=>MQ.matches;
function toGray(hex){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;const l=Math.round(0.2126*r+0.7152*g+0.0722*b);const h=l.toString(16).padStart(2,'0');return '#'+h+h+h}
function grayOf(colors){return colors.map(toGray)}
function svgToPng(svg,width){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=width; cv.height=Math.round(width*img.height/img.width);
      const x=cv.getContext('2d'); x.fillStyle='#FFFFFF'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url); cv.toBlob(b=>b?res(b):rej(new Error('png')),'image/png'); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

// estado
const $=id=>document.getElementById(id);
const S={visitors:150,avg:200,date:new Date(),mode:'date',season:0,salt:0,grid:false,sim:null,history:[],cur:null};
function ymd(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function fromYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function activeSeason(){return S.mode==='date'?seasonOf(S.date):S.season}
function keyFor(){return S.mode==='date'?ymd(S.date):'estacion-'+SEASONS[S.season].id}

function drawSeasons(){
  const si=activeSeason();
  $('bySeason').innerHTML=SEASONS.map((se,i)=>`<button class="sbtn" data-i="${i}" aria-pressed="${i===si}"><span>${se.name}</span><div class="chips">${se.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div></button>`).join('');
  $('bySeason').querySelectorAll('.sbtn').forEach(b=>b.addEventListener('click',()=>{S.season=+b.dataset.i;S.salt=0;render()}));
}

function render(record=true){
  const si=activeSeason(), se=SEASONS[si];
  const c=compose(keyFor(),S.visitors,S.avg,S.salt,se.colors.length);
  S.cur={c,colors:se.colors.slice(),season:se.name,visitors:S.visitors,pct:Math.round(S.visitors/S.avg*100),key:keyFor()};
  $('mark').innerHTML=svgFor(c,se.colors,S.grid,null,isV());
  $('bwPrev').innerHTML=svgFor(c,grayOf(se.colors),S.grid);
  $('kVis').textContent=S.visitors; $('kPct').textContent=S.cur.pct+'%'; $('kMod').textContent=c.n; $('kSea').textContent=se.name;
  $('corner').textContent=S.mode==='date'?ymd(S.date):'Estación';
  $('dateLong').textContent=S.mode==='date'?S.date.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Paleta de '+se.name.toLowerCase();
  drawSeasons();
  if(record){
    S.history.unshift({...S.cur,grid:S.grid});
    S.history=S.history.slice(0,12);
    $('thumbs').innerHTML=S.history.map((h,i)=>`<button class="thumb" data-i="${i}" aria-label="Variación ${i+1}">${svgFor(h.c,h.colors,false,null,isV())}<small><span>${h.visitors} pers · ${h.pct}%</span><span>${h.c.n} mód</span></small></button>`).join('');
    $('dlZip').disabled=!dl;
  }
}

function setVisitors(v){v=Math.max(0,Math.round(v));const changed=Math.floor(v/10)!==Math.floor(S.visitors/10);S.visitors=v;if(changed)S.salt=0;$('visitors').value=v;$('range').value=Math.min(v,+$('range').max);render(changed)}
function setMode(m){S.mode=m;$('modeDate').setAttribute('aria-pressed',m==='date');$('modeSeason').setAttribute('aria-pressed',m==='season');$('byDate').hidden=m!=='date';$('bySeason').hidden=m!=='season';if(m==='season')S.season=seasonOf(S.date);S.salt=0;render()}

$('modeDate').addEventListener('click',()=>setMode('date'));
$('modeSeason').addEventListener('click',()=>setMode('season'));
$('visitors').addEventListener('change',e=>setVisitors(+e.target.value||0));
$('range').addEventListener('input',e=>setVisitors(+e.target.value));
$('plus5').addEventListener('click',()=>setVisitors(S.visitors+10));
$('minus5').addEventListener('click',()=>setVisitors(S.visitors-10));
$('avg').addEventListener('change',e=>{S.avg=Math.max(10,+e.target.value||200);$('range').max=Math.round(S.avg*1.2);render()});
$('date').addEventListener('change',e=>{if(e.target.value){S.date=fromYmd(e.target.value);S.salt=0;render()}});
$('today').addEventListener('click',()=>{S.date=new Date();$('date').value=ymd(S.date);S.salt=0;render()});
$('regen').addEventListener('click',()=>{S.salt++;render()});
$('showGrid').addEventListener('change',e=>{S.grid=e.target.checked;render(false)});
$('sim').addEventListener('click',()=>{
  if(S.sim){clearInterval(S.sim);S.sim=null;$('sim').textContent='Simular el día';return}
  setVisitors(0);$('sim').textContent='Detener';
  S.sim=setInterval(()=>{ if(S.visitors>=S.avg*1.2){clearInterval(S.sim);S.sim=null;$('sim').textContent='Simular el día';return} setVisitors(S.visitors+10)},700);
});
$('thumbs').addEventListener('click',e=>{
  const b=e.target.closest('.thumb'); if(!b)return; const h=S.history[+b.dataset.i];
  $('mark').innerHTML=svgFor(h.c,h.colors,S.grid,null,isV()); $('bwPrev').innerHTML=svgFor(h.c,grayOf(h.colors),S.grid); S.cur=h;
  $('kVis').textContent=h.visitors;$('kPct').textContent=h.pct+'%';$('kMod').textContent=h.c.n;$('kSea').textContent=h.season;
});

// descargas
let dl=null; const st=$('status'); const DLIDS=['dlSvg','dlPng','dlSvgBw','dlPngBw','dlZip'];
function fname(h,ext,i,sfx=''){return `museo-evita_${h.key}_${h.visitors}p_${h.c.n}mod${sfx}${i!=null?'_'+String(i+1).padStart(2,'0'):''}.${ext}`}
async function save(filename,data){
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); st.textContent='Listo: '+filename;
  }catch(e){st.textContent='No se pudo descargar. Probá de nuevo.'}
}
$('dlSvg').addEventListener('click',()=>{const h=S.cur;save(fname(h,'svg'),new Blob([svgFor(h.c,h.colors,S.grid,2400)],{type:'image/svg+xml'}))});
$('dlPng').addEventListener('click',async()=>{const h=S.cur;st.textContent='Generando PNG…';try{const b=await svgToPng(svgFor(h.c,h.colors,S.grid,3000),3000);save(fname(h,'png'),b)}catch(e){st.textContent='No se pudo generar el PNG.'}});
$('dlSvgBw').addEventListener('click',()=>{const h=S.cur;save(fname(h,'svg',null,'_una-tinta'),new Blob([svgFor(h.c,grayOf(h.colors),S.grid,2400)],{type:'image/svg+xml'}))});
$('dlPngBw').addEventListener('click',async()=>{const h=S.cur;st.textContent='Generando PNG…';try{const b=await svgToPng(svgFor(h.c,grayOf(h.colors),S.grid,3000),3000);save(fname(h,'png',null,'_una-tinta'),b)}catch(e){st.textContent='No se pudo generar el PNG.'}});
$('dlZip').addEventListener('click',async()=>{
  if(!window.JSZip){st.textContent='No se pudo cargar el compresor del .zip.';return}
  st.textContent='Armando el .zip…';
  const zip=new JSZip();
  for(let i=0;i<S.history.length;i++){const h=S.history[i];const svg=svgFor(h.c,h.colors,false,2400);
    zip.file(fname(h,'svg',i),svg); try{zip.file(fname(h,'png',i),await svgToPng(svgFor(h.c,h.colors,false,2400),2400))}catch(e){} }
  const blob=await zip.generateAsync({type:'blob'});
  save('museo-evita_variaciones.zip',blob);
});
dl=true;

MQ.addEventListener('change',()=>{render(false);$('thumbs').innerHTML=S.history.map((h,i)=>`<button class="thumb" data-i="${i}" aria-label="Variación ${i+1}">${svgFor(h.c,h.colors,false,null,isV())}<small><span>${h.visitors} pers · ${h.pct}%</span><span>${h.c.n} mód</span></small></button>`).join('')});
$('date').value=ymd(S.date);
$('range').max=Math.round(S.avg*1.2);
render();
</script>
